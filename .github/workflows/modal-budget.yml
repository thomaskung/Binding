name: Modal budget alarm

# Monthly $30 Modal Starter credit guardrail (modal_app/README.md
# "Credit-budget guardrails"). Watches month-to-date METERED cost (pre-credit),
# NOT billed — billed_cost only turns positive after the whole $30 credit is
# gone, which is too late to act. Runs daily; warns at $20, fails + posts to a
# rolling issue at $28. An overrun that used to be caught only by a manual
# dashboard check (it wasn't — August 2026 hit $80.41 metered / $50.27 billed
# before anyone noticed) now trips an alarm.

on:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC daily
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Modal CLI
        # Pin the version whose `billing summary --json` schema this parser
        # relies on (metered_cost / billed_cost top-level string keys).
        run: pip install modal==1.5.3

      - name: Authenticate Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Fetch month-to-date metered cost
        id: cost
        run: |
          modal billing summary --for "this month" --json > /tmp/modal-billing.json
          python3 - <<'EOF'
          import json

          with open("/tmp/modal-billing.json") as f:
              data = json.load(f)

          metered = float(data["metered_cost"])
          billed = float(data["billed_cost"])
          print(f"metered_cost={metered}")
          print(f"billed_cost={billed}")
          print(f"Month-to-date metered: ${metered:.2f}  (billed: ${billed:.2f} after $30 credit)")
          EOF

      - name: Warn when metered cost passes $20
        if: fromJSON(steps.cost.outputs.metered_cost) >= 20 && fromJSON(steps.cost.outputs.metered_cost) < 28
        run: |
          echo "::warning::Modal metered cost is \$${{ steps.cost.outputs.metered_cost }} (of \$30 credit) — review modal_app/README.md guardrails (batch embeds, cap refine calls, or downsize a model)."

      - name: Post overrun to the rolling tracker issue
        if: fromJSON(steps.cost.outputs.metered_cost) >= 28
        uses: actions/github-script@v7
        env:
          METERED: ${{ steps.cost.outputs.metered_cost }}
          BILLED: ${{ steps.cost.outputs.billed_cost }}
        with:
          script: |
            const LABEL = 'modal-budget';
            const { owner, repo } = context.repo;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const body = [
              `Modal month-to-date metered cost is **$${process.env.METERED}** (billed $${process.env.BILLED} after the $30 credit) — above the $$28 alarm.`,
              ``,
              `- Workflow run: ${runUrl}`,
              `- Guardrails: modal_app/README.md "Credit-budget guardrails"`,
              `- Run \`modal billing summary --for "this month"\` and \`modal billing report --for "this month" --show-resources\` to see the breakdown.`,
            ].join('\n');

            // Idempotent label creation — 422 means it already exists.
            try {
              await github.rest.issues.createLabel({ owner, repo, name: LABEL, color: 'b60205', description: 'Rolling tracker for Modal budget overruns' });
            } catch (err) {
              if (err.status !== 422) throw err;
            }

            const { data: existing } = await github.rest.issues.listForRepo({
              owner, repo, labels: LABEL, state: 'all', sort: 'created', direction: 'desc', per_page: 1,
            });

            if (existing.length === 0) {
              await github.rest.issues.create({ owner, repo, title: 'Modal budget — monthly overrun (rolling tracker)', labels: [LABEL], body });
              return;
            }

            const tracker = existing[0];
            if (tracker.state === 'closed') {
              await github.rest.issues.update({ owner, repo, issue_number: tracker.number, state: 'open' });
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: tracker.number, body });

      - name: Close the rolling tracker issue when back under budget
        if: fromJSON(steps.cost.outputs.metered_cost) < 28
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'modal-budget';
            const { owner, repo } = context.repo;
            const { data: openTrackers } = await github.rest.issues.listForRepo({
              owner, repo, labels: LABEL, state: 'open', sort: 'created', direction: 'desc', per_page: 1,
            });
            if (openTrackers.length === 0) return;
            await github.rest.issues.update({ owner, repo, issue_number: openTrackers[0].number, state: 'closed' });

      - name: Fail the job when metered cost is near the credit ceiling
        if: fromJSON(steps.cost.outputs.metered_cost) >= 28
        run: |
          echo "::error::Modal metered cost \$${{ steps.cost.outputs.metered_cost }} has passed the \$28 alarm (93% of the \$30 monthly credit)."
          exit 1
