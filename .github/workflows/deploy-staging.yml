name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch: # manual redeploy (e.g. after changing Vercel env vars)

jobs:
  # Apply pending DB migrations to hosted Supabase BEFORE the frontend ships,
  # so the deployed code never runs ahead of the schema. Previously nothing
  # applied migrations to staging (CI only deployed Vercel + Modal), so every
  # migration-bearing merge silently broke staging until a manual `db push`.
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending migrations (supabase db push)
        env:
          # Full pooler connection string, e.g.
          # postgresql://postgres.<ref>:<PW>@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?pgbouncer=true
          # (URL-encode any special chars in the password). Set in repo secrets.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL secret not set — skipping migrations (staging DB may drift from code)."
            exit 0
          fi
          npx --yes --safe-chain-skip-minimum-package-age supabase@latest db push \
            --db-url "$SUPABASE_DB_URL" --include-all --yes

  vercel:
    runs-on: ubuntu-latest
    needs: migrate # schema first, then ship the code that depends on it
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      # Direct CLI instead of amondnet/vercel-action@v25: that action pins
      # Vercel CLI 25.1.0, which Vercel's API now rejects ("requires version
      # 47.2.2 or later") — it broke every deploy since the workflow landed.
      - name: Deploy to Vercel
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  modal:
    runs-on: ubuntu-latest
    # No job-level `if:` on github.event.commits.*.modified — that payload is
    # unreliable on MERGE commits (the merged files are often absent), so Modal
    # changes silently skipped deploying. Detect the change with a real
    # before..after git diff instead (needs fetch-depth: 0).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect modal_app changes
        id: changed
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # manual trigger always implies intent to deploy
            changed="true"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            if git diff --name-only "${{ github.event.before }}" "${{ github.event.after }}" -- modal_app/ | grep -q .; then
              changed="true"
            else
              changed="false"
            fi
          else
            # first push / unknown ref — deploy to be safe
            changed="true"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "modal_app changed: $changed"

      - uses: actions/setup-python@v5
        if: steps.changed.outputs.changed == 'true'
        with:
          python-version: "3.12"

      # `modal deploy` imports the target file locally (on THIS runner) to
      # introspect the app before shipping it — it doesn't just parse the
      # source. All three modal_app/*.py files do `from fastapi import
      # Header, HTTPException` at module level, so the runner's own Python
      # env needs fastapi too, not just the image baked into the deployed
      # container (that image already installs `fastapi[standard]` via its
      # own `pip_install(...)` call — a separate, already-correct
      # installation). Omitting this failed every deploy across two
      # consecutive merges with `ModuleNotFoundError: No module named
      # 'fastapi'` on the `llm-small.py` import, which — because all three
      # `modal deploy` calls below run in one `set -euo pipefail` step —
      # silently blocked `llm.py`'s and `embeddings.py`'s deploys too.
      - run: pip install modal "fastapi[standard]"
        if: steps.changed.outputs.changed == 'true'

      # No working-directory: paths are repo-relative — combining
      # working-directory: modal_app with modal_app/… paths resolved to
      # modal_app/modal_app/… and would fail whenever this job triggered.
      #
      # set -euo pipefail makes a failed deploy fail the job loudly instead of
      # silently promoting a broken app to staging.
      - name: Deploy Modal apps
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          modal token set --token-id "${{ secrets.MODAL_TOKEN_ID }}" --token-secret "${{ secrets.MODAL_TOKEN_SECRET }}"
          modal deploy modal_app/llm-small.py
          modal deploy modal_app/llm.py
          modal deploy modal_app/embeddings.py

  # Post-merge smoke: nothing previously ran against staging between a merge
  # landing and the 3am nightly (e2e-staging.yml), so a broken merge could sit
  # undetected for up to a day. This catches it within minutes, and is also
  # the only job that actually proves the deploy works end to end — `vercel`
  # above only confirms the CLI deploy command exited 0, not that the app
  # loads or that a real journey (publish → reveal) still functions.
  smoke:
    runs-on: ubuntu-latest
    needs: vercel
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - run: pnpm exec playwright install --with-deps chromium

      # The production Modal apps (scaledown 120s) stay warm naturally during
      # the smoke run because it makes its Modal calls within 120s of the
      # warm-up. This step reads their URLs (stored as plain-text Vercel vars
      # by deploy-modal.yml) so the warm-up + test steps below use env vars,
      # never hardcoded URLs.
      - name: Fetch Modal URLs from Vercel
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          ALL=$(curl -s "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_API_TOKEN}")
          for name in MODAL_REDACT_URL MODAL_CREDENTIALS_URL MODAL_SUMMARY_URL MODAL_REFINE_URL MODAL_EMBED_URL MODAL_EXTRACT_URL; do
            value=$(echo "$ALL" | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((e['value'] for e in d.get('envs',[]) if e['key']=='$name'), ''))" 2>/dev/null || echo "")
            if [ -n "$value" ]; then
              echo "${name}=${value}" >> "$GITHUB_ENV"
            else
              echo "::warning::$name not found in Vercel env — tests will fail on Modal calls"
            fi
          done

      # smoke.spec.ts runs ALONE, in its own `playwright test` invocation, so
      # its globalSetup warm-up (E2E_WARM_MODAL=1) fires immediately before
      # the ONE test that actually needs Modal — nothing else can run first
      # and eat into the scaledown_window.
      #
      # This used to be one command listing smoke.spec.ts FIRST alongside the
      # 5 Modal-free specs, which looks like it should work but doesn't:
      # Playwright ignores the order files are listed on the CLI and runs
      # discovered spec files in its own (alphabetical) order regardless.
      # smoke.spec.ts sorts after app-shell/market-intel-dimensions/
      # recruiter-onboarding-wizard/signup, so it actually ran 12th of 13
      # tests — by then the warm-up from ~4 minutes earlier (2m45s of
      # sequential warm-up calls + 11 preceding tests) had already cooled
      # back down, and the test's redact+embed call blew its 90s budget.
      # Confirmed from two real CI failures on 2026-08-07 (runs 31156056325,
      # 31159384735) before splitting this into two invocations.
      - name: Run smoke against staging (runs alone)
        run: npx playwright test e2e/smoke.spec.ts
        env:
          E2E_BASE_URL: https://binding-staging.vercel.app
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
          # Literal, matching e2e-staging.yml and ci.yml: an unset secret
          # renders as "", and staging-helpers.ts's env() only falls back on
          # null/undefined (`??`), so "" would win over the "staging" default
          # and every request would 401 at the basic-auth gate.
          E2E_STAGING_BASIC_USER: staging
          E2E_STAGING_BASIC_PW: ${{ secrets.E2E_STAGING_BASIC_PW }}
          E2E_STAGING_SECRET: ${{ secrets.E2E_STAGING_SECRET }}
          # smoke.spec.ts hits Modal (a real publish/reveal round trip) —
          # warm the endpoints first, same reasoning as the nightly's
          # globalSetup pass in e2e-staging.yml. globalSetup is the ONLY warm
          # path here (the E2E apps' 3600s window covers the whole run), so
          # MODAL_API_TOKEN + the fetched E2E URLs are required.
          MODAL_API_TOKEN: ${{ secrets.MODAL_API_TOKEN }}
          MODAL_REDACT_URL: ${{ env.MODAL_REDACT_URL }}
          MODAL_CREDENTIALS_URL: ${{ env.MODAL_CREDENTIALS_URL }}
          MODAL_SUMMARY_URL: ${{ env.MODAL_SUMMARY_URL }}
          MODAL_REFINE_URL: ${{ env.MODAL_REFINE_URL }}
          MODAL_EMBED_URL: ${{ env.MODAL_EMBED_URL }}
          MODAL_EXTRACT_URL: ${{ env.MODAL_EXTRACT_URL }}
          E2E_WARM_MODAL: '1'
          # Shared never-reset staging DB accumulates identical-embedding
          # seekers that crowd fresh ones out of match_candidates' top-20;
          # raise for the test run so the smoke match always surfaces.
          MATCH_TOP_N: '500'

      # The 7 Modal-free specs from the PR gate (ci.yml, job `e2e`), run
      # separately and without E2E_WARM_MODAL — they never touch Modal, so
      # there's nothing to warm and no reason to pay for another globalSetup
      # warm-up pass. recruiter-pipeline-dashboard.spec.ts was missing from
      # this list until now — Phase 2's PR added it to ci.yml's PR gate but
      # not here, a real drift caught while rebasing Phase 3 on top.
      - name: Run Modal-free specs against staging
        run: npx playwright test e2e/app-shell.spec.ts e2e/signup.spec.ts e2e/recruiter-onboarding-wizard.spec.ts e2e/training-benefits.spec.ts e2e/market-intel-dimensions.spec.ts e2e/recruiter-pipeline-dashboard.spec.ts e2e/login-oauth.spec.ts
        env:
          E2E_BASE_URL: https://binding-staging.vercel.app
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
          E2E_STAGING_BASIC_USER: staging
          E2E_STAGING_BASIC_PW: ${{ secrets.E2E_STAGING_BASIC_PW }}
          E2E_STAGING_SECRET: ${{ secrets.E2E_STAGING_SECRET }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace-smoke
          path: test-results/
          retention-days: 7
