name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # E2E (needs local Supabase) is a follow-up: supabase/setup-cli action +
      # `supabase start` + `pnpm e2e`. Kept out of the required path for now to
      # keep CI fast while the skeleton stabilizes.
