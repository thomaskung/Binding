name: Staging E2E
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  wait-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Vercel deploy
        run: |
          echo "Checking Vercel deployment status..."
          DEPLOYED=$(curl -s "https://api.vercel.com/v1/deployments?teamId=${{ secrets.VERCEL_ORG_ID }}&projectId=${{ secrets.VERCEL_PROJECT_ID }}&limit=1&target=production" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_API_TOKEN }}" 2>/dev/null)
          STATE=$(echo "$DEPLOYED" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['deployments'][0]['state'] if d.get('deployments') else '')" 2>/dev/null || echo "")
          if [ "$STATE" = "BUILDING" ] || [ "$STATE" = "QUEUED" ]; then
            echo "Deployment in progress — waiting..."
            for i in $(seq 1 30); do
              sleep 20
              STATE=$(curl -s "https://api.vercel.com/v1/deployments?teamId=${{ secrets.VERCEL_ORG_ID }}&projectId=${{ secrets.VERCEL_PROJECT_ID }}&limit=1&target=production" \
                -H "Authorization: Bearer ${{ secrets.VERCEL_API_TOKEN }}" 2>/dev/null | \
                python3 -c "import sys,json; d=json.load(sys.stdin); print(d['deployments'][0]['state'] if d.get('deployments') else '')" 2>/dev/null || echo "")
              if [ "$STATE" = "READY" ]; then echo "Deploy ready"; exit 0; fi
            done
            echo "Timeout waiting for deploy"; exit 1
          fi
          echo "Latest deploy state: $STATE"

  functional:
    needs: wait-deploy
    runs-on: ubuntu-latest
    permissions:
      issues: write
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '11.5.2' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install
      - name: Fetch Modal URLs from Vercel
        # The production Modal apps' URLs (stored as plain-text Vercel vars by
        # deploy-modal.yml) so the warm-up curls + global-setup below point at
        # the right endpoints. No hardcoded URLs.
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          ALL=$(curl -s "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_API_TOKEN}")
          for name in MODAL_REDACT_URL MODAL_CREDENTIALS_URL MODAL_SUMMARY_URL MODAL_REFINE_URL MODAL_EMBED_URL MODAL_EXTRACT_URL; do
            value=$(echo "$ALL" | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((e['value'] for e in d.get('envs',[]) if e['key']=='$name'), ''))" 2>/dev/null || echo "")
            if [ -n "$value" ]; then
              echo "${name}=${value}" >> "$GITHUB_ENV"
            else
              echo "::warning::$name not found in Vercel env — tests will fail on Modal calls"
            fi
          done
      - name: Modal warm-up
        # Warm one endpoint per app CONCURRENTLY, RETRYING until each returns
        # 200. redact/refine/extract/fit-summary all live on binding-llm (same
        # container + model load), so warming redact warms all four — firing all
        # 6 at once would hit one cold app with 4 concurrent requests and risk
        # Modal scale-out. Background each curl and `wait` so the 3 cold starts
        # run in parallel (~3 min instead of ~7 serial).
        run: |
          warm() {
            local url="$1" body="$2" label="$3" attempts="$4"
            (
              for i in $(seq 1 "$attempts"); do
                code=$(curl -s -m 120 -X POST "$url" \
                  -H "Authorization: Bearer ${{ secrets.MODAL_API_TOKEN }}" \
                  -H "Content-Type: application/json" \
                  -d "$body" -o /dev/null -w "%{http_code}" || echo "000")
                echo "warm $label attempt $i -> $code"
                [ "$code" = "200" ] && exit 0
                sleep 5
              done
            ) &
          }
          warm "$MODAL_EMBED_URL" '{"text":"warmup"}' embed 5
          warm "$MODAL_REDACT_URL" '{"text":"warmup"}' redact 5
          warm "$MODAL_CREDENTIALS_URL" '{"text":"warmup","kind":"credentials"}' credentials 5
          wait
      - name: App warm-up
        # Spin up the Next.js serverless functions for the routes the tests hit
        # first, so React hydration isn't racing a cold lambda (the "email fill
        # did not stick" failures — tests 16/17 — are cold-hydration flakes).
        run: |
          for path in "/health" "/login" "/" "/seeker" "/recruiter"; do
            for i in 1 2; do
              curl -s -m 40 "https://binding-staging.vercel.app$path" \
                -u "staging:${{ secrets.E2E_STAGING_BASIC_PW }}" \
                -H "x-staging-auth: ${{ secrets.E2E_STAGING_SECRET }}" \
                -o /dev/null -w "warmed %{http_code} %{time_total}s $path\n" || true
            done
          done
      - run: npx playwright install chromium
      - name: Re-warm Modal right before tests
        # The earlier warm-up runs BEFORE `playwright install` (5+ min). This
        # re-warm is a cheap safety net right before the suite — the first
        # warm-up may have run while the apps were still deploying. Same one
        # endpoint per app + parallel pattern as the "Modal warm-up" step.
        run: |
          warm() {
            local url="$1" body="$2" label="$3" attempts="$4"
            (
              for i in $(seq 1 "$attempts"); do
                code=$(curl -s -m 120 -X POST "$url" \
                  -H "Authorization: Bearer ${{ secrets.MODAL_API_TOKEN }}" \
                  -H "Content-Type: application/json" \
                  -d "$body" -o /dev/null -w "%{http_code}" || echo "000")
                echo "pre-test warm $label attempt $i -> $code"
                [ "$code" = "200" ] && exit 0
                sleep 3
              done
            ) &
          }
          warm "$MODAL_EMBED_URL" '{"text":"warmup"}' embed 3
          warm "$MODAL_REDACT_URL" '{"text":"warmup"}' redact 3
          warm "$MODAL_CREDENTIALS_URL" '{"text":"warmup","kind":"credentials"}' credentials 3
          wait
      - name: Run functional tests
        id: tests
        # Now runs the WHOLE suite (all 13 spec files, no path argument — the
        # config's testDir is ./e2e), not just staging-functional.spec.ts —
        # the PR gate (ci.yml, job `e2e`) only covers 5 Modal-free specs, so
        # this nightly run is now the only place the Modal-touching journeys
        # (publish/reveal/extract/refine) get exercised end to end.
        #
        # Deliberately `npx playwright test`, not `pnpm e2e --`: pnpm forwards
        # a literal `--` through to the underlying script instead of
        # stripping it (verified locally — `pnpm e2e -- --retries=1 --list`
        # invoked `playwright test -- --retries=1 --list`, which does not do
        # what it looks like), so `--retries=1` would silently not apply.
        #
        # Excludes staging-uat.spec.ts (every scenario lives in a `UAT: ...`
        # describe block, so --grep-invert "UAT:" is a safe file-level filter):
        # the uat-evidence job below is the single owner of that spec now, so
        # its evidence screenshots are produced exactly once per night instead
        # of twice (~15 fewer Modal calls).
        run: npx playwright test --retries=1 --grep-invert "UAT:"
        env:
          E2E_BASE_URL: https://binding-staging.vercel.app
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
          E2E_STAGING_SECRET: ${{ secrets.E2E_STAGING_SECRET }}
          E2E_STAGING_BASIC_USER: staging
          E2E_STAGING_BASIC_PW: ${{ secrets.E2E_STAGING_BASIC_PW }}
          # globalSetup's Modal warm-up needs the same token the curl
          # warm-up steps above use.
          MODAL_API_TOKEN: ${{ secrets.MODAL_API_TOKEN }}
          # Production Modal app URLs (fetched from Vercel above) so
          # global-setup warms the right endpoints.
          MODAL_REDACT_URL: ${{ env.MODAL_REDACT_URL }}
          MODAL_CREDENTIALS_URL: ${{ env.MODAL_CREDENTIALS_URL }}
          MODAL_SUMMARY_URL: ${{ env.MODAL_SUMMARY_URL }}
          MODAL_REFINE_URL: ${{ env.MODAL_REFINE_URL }}
          MODAL_EMBED_URL: ${{ env.MODAL_EMBED_URL }}
          MODAL_EXTRACT_URL: ${{ env.MODAL_EXTRACT_URL }}
          # Makes Playwright's globalSetup warm the Modal endpoints too, right
          # at the start of the test process. This is NOT redundant with the
          # three curl warm-up steps above: those run BEFORE `pnpm install`/
          # `playwright install` even start, buying Modal 5+ minutes of extra
          # container lead time that a globalSetup starting at t=0 of the test
          # process cannot. Both passes are deliberate — see the "Re-warm
          # Modal right before tests" step above for why even three warm-up
          # passes weren't always enough.
          E2E_WARM_MODAL: '1'
          # The shared, never-reset staging DB accumulates @staging.local
          # seekers (all embedded with the same generic matching text, scoring
          # ~0.89 against every "Backend Engineer" job). With the default
          # MATCH_TOP_N=20 they crowd fresh per-run seekers out of
          # match_candidates' top-20, so smoke/pipeline/compare never see a
          # match card. Raise it for the test run so fresh seekers always rank
          # in (product default stays 20).
          MATCH_TOP_N: '500'

      # Report + enforce the Modal AI call budget. Runs AFTER the whole suite
      # (so all workers are done and the counter file holds the final count —
      # the previous in-suite zz-ai-budget.spec.ts relied on "sorts last", which
      # under-counted under workers:4). Prints the per-spec breakdown + total
      # for visibility, then fails the job if the total exceeds BUDGET.
      # BUDGET is a generous placeholder (40) until a clean run re-measures the
      # true count; tune it down to measured + 2 afterwards.
      - name: Report + enforce Modal AI call budget
        if: always()
        run: |
          if [ ! -f test-results/ai-calls.log ]; then
            echo "::warning::test-results/ai-calls.log not found — counter did not run"
            exit 0
          fi
          echo "=== Modal AI calls by spec ==="
          sort test-results/ai-calls.log | uniq -c | sort -rn
          TOTAL=$(wc -l < test-results/ai-calls.log | tr -d ' ')
          BUDGET=40
          echo "=== Total: $TOTAL (budget: $BUDGET) ==="
          if [ "$TOTAL" -gt "$BUDGET" ]; then
            echo "::error::Modal AI call budget exceeded: $TOTAL > $BUDGET"
            exit 1
          fi

      # Report failures onto ONE rolling issue instead of opening a new one per
      # run. The previous version called issues.create() unconditionally, which
      # accumulated 16 identical "Staging E2E — functional tests failed" issues
      # between Aug 3-5 2026 (all closed in bulk on Aug 6) — noise that buries
      # the failure it is supposed to surface.
      #
      # Dedup is by LABEL, not by title search: the search API is rate-limited
      # and eventually consistent, so a title search intermittently misses the
      # open issue and creates the duplicate we are trying to prevent. Label
      # lookups hit the issues API directly and are strongly consistent.
      #
      # `state: 'all'` matters — if a human closes the tracker and the nightly
      # fails again, an open-only query finds nothing and we are back to
      # creating duplicates. Reopen the newest labelled issue instead.
      - name: Report failure on the rolling tracker issue
        if: failure()
        uses: actions/github-script@v7
        env:
          # Passed through env (not `${{ }}` interpolated into the script body)
          # so the value can never be parsed as JavaScript.
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        with:
          script: |
            const LABEL = 'nightly-e2e';
            const { owner, repo } = context.repo;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            // `if: failure()` fires for ANY failed step in this job — including
            // the Modal warm-up curls and `playwright install`, which are
            // infrastructure, not product regressions. Distinguishing the two
            // in the body is what makes the tracker triageable: a large share of
            // the Aug 3-5 issues were infra flakes filed as test failures.
            const suiteRan = process.env.TESTS_OUTCOME === 'failure';
            const phase = suiteRan
              ? '**The Playwright functional suite itself failed.** Likely a real regression — check the run log and traces.'
              : `**Failed BEFORE the suite ran** (setup / Modal warm-up / \`playwright install\`; test step outcome: \`${process.env.TESTS_OUTCOME}\`). Usually infrastructure — cold Modal containers, a Vercel deploy that never went READY, or a transient install failure — not a product regression.`;

            const body = [
              `Nightly staging functional tests failed.`,
              ``,
              phase,
              ``,
              `- Workflow run: ${runUrl}`,
              `- Staging: https://binding-staging.vercel.app`,
              `- Commit: \`${context.sha}\``,
            ].join('\n');

            // Idempotent label creation — 422 means it already exists.
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: LABEL,
                color: 'b60205',
                description: 'Rolling tracker for nightly staging E2E failures',
              });
            } catch (err) {
              if (err.status !== 422) throw err;
            }

            const { data: existing } = await github.rest.issues.listForRepo({
              owner,
              repo,
              labels: LABEL,
              state: 'all',
              sort: 'created',
              direction: 'desc',
              per_page: 1,
            });

            if (existing.length === 0) {
              await github.rest.issues.create({
                owner,
                repo,
                title: 'Staging E2E — nightly failures (rolling tracker)',
                labels: [LABEL],
                body,
              });
              return;
            }

            const tracker = existing[0];
            if (tracker.state === 'closed') {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: tracker.number,
                state: 'open',
              });
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: tracker.number,
              body,
            });

      - name: Close the rolling tracker issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'nightly-e2e';
            const { owner, repo } = context.repo;

            const { data: openTrackers } = await github.rest.issues.listForRepo({
              owner,
              repo,
              labels: LABEL,
              state: 'open',
              sort: 'created',
              direction: 'desc',
              per_page: 1,
            });

            if (openTrackers.length === 0) return;

            const tracker = openTrackers[0];
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: tracker.number,
              state: 'closed',
            });

  # Owns staging-uat.spec.ts exclusively: `functional` excludes it via
  # --grep-invert "UAT:" (see that step's comment), so this is the ONLY place
  # the 7 UAT scenarios run per night and their evidence is produced exactly
  # once. The suite-wide Modal budget is enforced in the `functional` job's
  # post-suite gate step (this job's ~3 UAT calls are well under any ceiling).
  uat-evidence:
    needs: functional
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '11.5.2' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install
      - run: npx playwright install chromium
      - name: Run UAT evidence tests
        run: npx playwright test e2e/staging-uat.spec.ts --retries=1
        env:
          E2E_BASE_URL: https://binding-staging.vercel.app
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
          E2E_STAGING_SECRET: ${{ secrets.E2E_STAGING_SECRET }}
          E2E_STAGING_BASIC_USER: staging
          E2E_STAGING_BASIC_PW: ${{ secrets.E2E_STAGING_BASIC_PW }}
          # Source of truth for the run id: the spec writes evidence under
          # e2e-results/<GITHUB_RUN_ID>/ and the upload step below pushes the
          # same folder into the bucket, so the scorer can find the latest run.
          GITHUB_RUN_ID: ${{ github.run_id }}
      - name: Upload UAT evidence to Supabase Storage
        run: node scripts/upload-uat-evidence.mjs
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
          RUN_ID: ${{ github.run_id }}

  score-uat:
    needs: uat-evidence
    runs-on: ubuntu-latest
    # The scoring agent must finish in one headless pass — a hung subagent
    # pipeline previously stalled the job past an hour. Fail fast instead.
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_UAT_READONLY_KEY }}
          # Headless `opencode github run` cannot answer interactive permission
          # prompts — a bare external_directory ask (/tmp staging) hung the job
          # for 30m. Pre-allow the tools the scorer needs so it never blocks.
          OPENCODE_PERMISSION: >-
            {"bash":"allow","edit":"allow","read":"allow","glob":"allow",
            "grep":"allow","list":"allow","webfetch":"allow","websearch":"allow",
            "task":"allow","external_directory":{"*":"allow"}}
        with:
          # opencode-go = the free "OpenCode Go"/Zen lane (same OPENCODE_API_KEY,
          # no prepaid balance) — the paid opencode/deepseek-v4-pro API errored
          # with "Insufficient balance". deepseek-v4-flash is the fast lane.
          model: opencode-go/deepseek-v4-flash
          use_github_token: true
          prompt: |
            You are the UAT scorer for Binding staging. Score each scenario in
            ONE headless pass — do not spawn subagents.

            1. Read BUSINESS.md and e2e/uat-rubric.json from the repo.
            2. Fetch the latest test evidence from Supabase bucket
               staging-test-evidence. Use the SUPABASE_URL and
               SUPABASE_SERVICE_ROLE_KEY from environment variables.
            3. For each of the 7 UAT scenarios, read the scenario's evidence
               files (screenshots + DOM state) and the relevant BUSINESS.md
               section, then score it yourself against e2e/uat-rubric.json.
            4. Fetch the previous baseline from staging-test-scores/latest.json.
               If any score dropped from baseline, flag as regression with
               specific detail.
            5. Output the complete scored report as JSON.
            6. Store the report to Supabase bucket staging-test-scores/{runId}.json
               and update staging-test-scores/latest.json.
            7. If any score < 3 OR any regression detected, create a GitHub
               issue with the failure summary and a link to the evidence bucket.
            8. Purge evidence runs older than 3 from the staging-test-evidence
               bucket.
