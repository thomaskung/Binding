name: Staging Cleanup
on:
  # Fires right after the nightly "Staging E2E" workflow finishes, rather
  # than a fixed cron gap — the old 2:30 UTC cron ran only ~2.5h after that
  # run's own midnight-UTC start, so its own @staging.local users (still
  # under the old 24h filter) were skipped and lingered a full extra day.
  # No `conclusion == 'success'` gate: nightly e2e is expected to sometimes
  # be red (see CLAUDE.md's open staging-investigation gotcha), and gating
  # on success would silently stop cleanup from ever firing while it is.
  workflow_run:
    workflows: ['Staging E2E']
    types: [completed]
  # Backstop: workflow_run only fires from Staging E2E completing, so if that
  # workflow is ever renamed/disabled/starved (e.g. GitHub auto-disables
  # scheduled workflows after prolonged repo inactivity), cleanup would
  # silently never run again with no independent trigger of its own. A daily
  # cron re-adds that independence; the 60-min staleness filter in
  # cleanup-staging.mjs makes a redundant same-day firing a no-op.
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '11.5.2' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install
      - name: Delete stale test users
        run: node scripts/cleanup-staging.mjs
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
