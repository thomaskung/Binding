name: Deploy Modal (on-demand)

# Manual Modal deploy for the demo / after the endpoints have been torn down.
# Uses the MODAL_TOKEN_ID/SECRET already stored as GitHub Actions secrets — the
# credentials never leave CI. After deploy, writes the resolved endpoint URLs
# into the Vercel staging project env (AI_PROVIDER=modal + the five MODAL_*_URL
# vars + MODAL_API_TOKEN) via the Vercel API so the deployed app immediately
# talks to the fresh endpoints. See src/lib/ai/modal.ts for the env-var contract.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal
      - name: Deploy Modal apps + capture endpoint URLs
        id: endpoints
        run: |
          set -euo pipefail
          modal token set --token-id "${{ secrets.MODAL_TOKEN_ID }}" --token-secret "${{ secrets.MODAL_TOKEN_SECRET }}"
          # The Modal apps reference Secret.from_name("binding-api-token"),
          # which holds MODAL_API_TOKEN (the bearer the endpoints' _auth checks).
          # Create/refresh it from the GH secret so deploy resolves it and the
          # app's bearer matches the endpoint's expected token. Idempotent.
          modal secret create binding-api-token MODAL_API_TOKEN="${{ secrets.MODAL_API_TOKEN }}" --force
          # tee deploy output so we can pull the printed web-endpoint URLs
          modal deploy modal_app/embeddings.py 2>&1 | tee embed.log
          modal deploy modal_app/llm.py 2>&1 | tee llm.log

          # One-time cleanup of the pre-rename apps (jumponboard-* → binding-*).
          # Idempotent — harmless once they're already gone.
          modal app stop jumponboard-embeddings 2>/dev/null || true
          modal app stop jumponboard-llm 2>/dev/null || true

          # Map each endpoint to the env var name src/lib/ai/modal.ts expects.
          # The `tee` below streams deploy output while map_url reads the log —
          # wait for the URL to appear rather than racing the flush.
          map_url() {
            # $1 = grep pattern for the endpoint, $2 = env var name, $3 = logfile
            local url=""
            for _ in $(seq 1 20); do
              url=$(grep -Eo 'https://[a-z0-9.-]+\.modal\.run' "$3" | grep -i "$1" | head -1 || true)
              [ -n "$url" ] && break
              sleep 1
            done
            if [ -z "$url" ]; then
              echo "::error::Could not resolve $2 from Modal deploy output"
              exit 1
            fi
            echo "  $2=$url"
            echo "$2=$url" >> "$GITHUB_ENV"
            # Also set it in THIS step's shell so the summary below can read it.
            export "$2=$url"
          }
          map_url "embed"       MODAL_EMBED_URL   embed.log
          map_url "redact"      MODAL_REDACT_URL  llm.log
          map_url "fit-summary" MODAL_SUMMARY_URL llm.log
          map_url "refine"      MODAL_REFINE_URL  llm.log
          map_url "extract"     MODAL_EXTRACT_URL llm.log

          echo "## Modal endpoints" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "MODAL_EMBED_URL=$MODAL_EMBED_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "MODAL_REDACT_URL=$MODAL_REDACT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "MODAL_SUMMARY_URL=$MODAL_SUMMARY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "MODAL_REFINE_URL=$MODAL_REFINE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "MODAL_EXTRACT_URL=$MODAL_EXTRACT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Wire endpoints into Vercel staging env
        run: |
          set -euo pipefail
          # idempotent upsert per var: delete any existing value, then create.
          for name in AI_PROVIDER MODAL_EMBED_URL MODAL_REDACT_URL MODAL_SUMMARY_URL MODAL_REFINE_URL MODAL_EXTRACT_URL MODAL_API_TOKEN; do
            case "$name" in
              AI_PROVIDER)        value="modal" ;;
              MODAL_API_TOKEN)    value="${{ secrets.MODAL_API_TOKEN }}" ;;
              *)                  value="${!name}" ;;
            esac
            echo "Upserting $name (len=${#value})"

            # find existing env var id(s) for this key in production/preview
            existing=$(curl -s "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}/env?teamId=${{ secrets.VERCEL_ORG_ID }}" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_API_TOKEN }}" | \
              jq -r '.envs[] | select(.key=="'"$name"'" and (("production" in .target) or ("preview" in .target))) | .id')
            for id in $existing; do
              curl -s -X DELETE "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}/env/$id?teamId=${{ secrets.VERCEL_ORG_ID }}" \
                -H "Authorization: Bearer ${{ secrets.VERCEL_API_TOKEN }}" >/dev/null
            done

            curl -s -X POST "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}/env?teamId=${{ secrets.VERCEL_ORG_ID }}" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"$name\",\"value\":$(python3 -c "import json,sys; print(json.dumps(sys.argv[1]))" "$value"),\"type\":\"encrypted\",\"target\":[\"production\",\"preview\"]}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print('  created:', d.get('key'), 'id:', d.get('id'))"
          done

      - name: Redeploy staging with new env
        run: |
          npx vercel@latest deploy --prod --yes --token "${{ secrets.VERCEL_API_TOKEN }}" --force
