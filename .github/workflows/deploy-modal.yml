name: Deploy Modal (on-demand)

# Manual Modal deploy for the demo / after the endpoints have been torn down.
# Uses the MODAL_TOKEN_ID/SECRET already stored as GitHub Actions secrets — the
# credentials never leave CI. After deploy, writes the resolved endpoint URLs
# into the Vercel staging project env (AI_PROVIDER=modal + the six MODAL_*_URL
# vars + the six E2E_MODAL_*_URL vars + MODAL_API_TOKEN) via the Vercel API so
# the deployed app immediately talks to the fresh endpoints. See
# src/lib/ai/modal.ts for the env-var contract.
#
# Two endpoint sets, deployed from the same three source files with MODAL_E2E
# controlling the app name + scaledown_window:
#   - production (MODAL_E2E unset): binding-llm-small / binding-llm /
#     binding-embeddings, scaledown 120s
#   - e2e (MODAL_E2E=1): binding-llm-small-e2e / binding-llm-e2e /
#     binding-embeddings-e2e, scaledown 3600s — kept warm across long CI runs.
# The E2E URLs are stored as plain-text Vercel vars so CI workflows can READ
# them back and point their warm-up curls / global-setup at the e2e apps.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal fastapi  # fastapi: module-top Header import runs at deploy introspection
      - name: Deploy Modal apps + capture endpoint URLs
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          APP_BEARER: ${{ secrets.MODAL_API_TOKEN }}
        run: |
          set -euo pipefail
          modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"
          # The apps reference Secret.from_name("binding-api-token") holding
          # MODAL_API_TOKEN (the bearer _auth checks). Refresh from the GH secret
          # via env (no inline-quoting pitfalls). Idempotent.
          # Pin everything to the 'main' environment so secret-create and
          # deploy can't diverge into different Modal environments.
          modal secret create binding-api-token MODAL_API_TOKEN="$APP_BEARER" --force -e main

          # Stop + redeploy. set -euo pipefail makes ANY failed deploy fail the
          # job loudly — a broken app never gets silently promoted to staging.
          modal app stop binding-embeddings -e main 2>/dev/null || true
          modal app stop binding-llm -e main 2>/dev/null || true
          modal app stop binding-llm-small -e main 2>/dev/null || true
          modal app stop binding-embeddings-e2e -e main 2>/dev/null || true
          modal app stop binding-llm-e2e -e main 2>/dev/null || true
          modal app stop binding-llm-small-e2e -e main 2>/dev/null || true
          sleep 5

          modal deploy modal_app/llm-small.py -e main 2>&1 | tee llm-small.log
          modal deploy modal_app/llm.py -e main 2>&1 | tee llm.log
          modal deploy modal_app/embeddings.py -e main 2>&1 | tee embed.log
          MODAL_E2E=1 modal deploy modal_app/llm-small.py -e main 2>&1 | tee llm-small-e2e.log
          MODAL_E2E=1 modal deploy modal_app/llm.py -e main 2>&1 | tee llm-e2e.log
          MODAL_E2E=1 modal deploy modal_app/embeddings.py -e main 2>&1 | tee embed-e2e.log

          # CI-side auth test: CI holds the same GH secret that baked the Modal
          # secret, so this MUST be 200 once propagated — proves the endpoint
          # accepts the GH-secret value (isolates propagation/caching vs a
          # local value mismatch). Retry through the cold start.
          EMBED=$(grep -Eo 'https://[a-z0-9.-]+\.modal\.run' embed.log | grep -i embed | head -1)
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 180 -X POST "$EMBED" \
              -H "content-type: application/json" -H "authorization: Bearer $APP_BEARER" \
              -d '{"text":"ci auth check"}')
            echo "CI self-auth embed attempt $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 3
          done

          # Map each endpoint to the env var name src/lib/ai/modal.ts expects.
          # Each deploy log contains URLs from ONE app only, so `grep -i`
          # disambiguates the two /refine endpoints (llm-small.log -> the
          # credentials refine; llm.log -> the profile/jd/career refine).
          # Writes to GITHUB_ENV so the Vercel-wiring step below can read them.
          echo "## Modal endpoints" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          map_url() {
            # $1 = grep pattern for the endpoint, $2 = env var name, $3 = logfile
            url=$(grep -Eo 'https://[a-z0-9.-]+\.modal\.run' "$3" | grep -i "$1" | head -1 || true)
            echo "$2=${url:-<not found>}" >> "$GITHUB_STEP_SUMMARY"
            if [ -z "$url" ]; then
              echo "::error::Could not resolve $2 from Modal deploy output"
              exit 1
            fi
            echo "$2=$url" >> "$GITHUB_ENV"
            # Also set it in THIS step's shell so the summary below can read it.
            export "$2=$url"
          }
          map_url "redact"      MODAL_REDACT_URL       llm.log
          map_url "refine"      MODAL_CREDENTIALS_URL  llm-small.log
          map_url "extract"     MODAL_EXTRACT_URL      llm.log
          map_url "fit-summary" MODAL_SUMMARY_URL      llm.log
          map_url "refine"      MODAL_REFINE_URL       llm.log
          map_url "embed"       MODAL_EMBED_URL        embed.log
          map_url "redact"      E2E_MODAL_REDACT_URL       llm-e2e.log
          map_url "refine"      E2E_MODAL_CREDENTIALS_URL  llm-small-e2e.log
          map_url "extract"     E2E_MODAL_EXTRACT_URL      llm-e2e.log
          map_url "fit-summary" E2E_MODAL_SUMMARY_URL      llm-e2e.log
          map_url "refine"      E2E_MODAL_REFINE_URL       llm-e2e.log
          map_url "embed"       E2E_MODAL_EMBED_URL        embed-e2e.log

          for name in \
            MODAL_REDACT_URL MODAL_CREDENTIALS_URL MODAL_EXTRACT_URL MODAL_SUMMARY_URL MODAL_REFINE_URL MODAL_EMBED_URL \
            E2E_MODAL_REDACT_URL E2E_MODAL_CREDENTIALS_URL E2E_MODAL_EXTRACT_URL E2E_MODAL_SUMMARY_URL E2E_MODAL_REFINE_URL E2E_MODAL_EMBED_URL; do
            echo "$name=${!name}" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Wire endpoints into Vercel staging env
        run: |
          set -euo pipefail
          # idempotent upsert per var: delete any existing value, then create.
          # Production MODAL_*_URL vars are encrypted; the E2E_MODAL_*_URL vars
          # are PLAIN so CI workflows can read them back to warm the e2e apps.
          # MODAL_API_TOKEN stays encrypted and comes from the GH secret.
          for name in AI_PROVIDER MODAL_EMBED_URL MODAL_REDACT_URL MODAL_CREDENTIALS_URL MODAL_SUMMARY_URL MODAL_REFINE_URL MODAL_EXTRACT_URL \
            E2E_MODAL_EMBED_URL E2E_MODAL_REDACT_URL E2E_MODAL_CREDENTIALS_URL E2E_MODAL_SUMMARY_URL E2E_MODAL_REFINE_URL E2E_MODAL_EXTRACT_URL MODAL_API_TOKEN; do
            case "$name" in
              AI_PROVIDER)        value="modal" ;;
              MODAL_API_TOKEN)    value="${{ secrets.MODAL_API_TOKEN }}" ;;
              *)                  value="${!name}" ;;
            esac
            vtype="encrypted"
            case "$name" in
              E2E_*) vtype="plain" ;;
            esac
            echo "Upserting $name (len=${#value}, type=$vtype)"

            # find existing env var id(s) for this key in production/preview
            existing=$(curl -s "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}/env?teamId=${{ secrets.VERCEL_ORG_ID }}" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_API_TOKEN }}" | \
              jq -r --arg key "$name" '.envs[] | select(.key == $key and ((.target | index("production")) or (.target | index("preview")))) | .id')
            for id in $existing; do
              curl -s -X DELETE "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}/env/$id?teamId=${{ secrets.VERCEL_ORG_ID }}" \
                -H "Authorization: Bearer ${{ secrets.VERCEL_API_TOKEN }}" >/dev/null
            done

            curl -s -X POST "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}/env?teamId=${{ secrets.VERCEL_ORG_ID }}" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"$name\",\"value\":$(python3 -c "import json,sys; print(json.dumps(sys.argv[1]))" "$value"),\"type\":\"$vtype\",\"target\":[\"production\",\"preview\"]}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print('  created:', d.get('key'), 'id:', d.get('id'))"
          done

      - name: Redeploy staging with new env
        run: |
          npx vercel@latest deploy --prod --yes --token "${{ secrets.VERCEL_API_TOKEN }}" --force
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}